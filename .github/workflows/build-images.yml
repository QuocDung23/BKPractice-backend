name: Build production images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: bkpractice_integration_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U ci -d bkpractice_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Run PostgreSQL integration suites
        env:
          UC02_SUBMISSION_TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/bkpractice_integration_test
          TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:${{ job.services.postgres.ports[5432] }}/bkpractice_integration_test
        run: >-
          pnpm test --runTestsByPath
          test/uc02-practice-submission.integration.spec.ts
          test/uc03-problem-bank.integration.spec.ts
          apps/learning-service/src/modules/courses/courses.module.integration.spec.ts
      - name: Run isolated Community PostgreSQL suite
        env:
          COMMUNITY_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          COMMUNITY_TEST_POSTGRES_USER: ci
        run: node scripts/test-community-postgres.mjs
      - run: pnpm build

  publish:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: app, dockerfile: docker/Dockerfile, target: runtime }
          - { image: migration, dockerfile: docker/Dockerfile, target: migration }
          - { image: judge, dockerfile: docker/judge/Dockerfile.worker, target: runtime }
          - { image: judge-c, dockerfile: docker/judge/c/Dockerfile, target: '' }
          - { image: judge-cpp, dockerfile: docker/judge/cpp/Dockerfile, target: '' }
          - { image: judge-java, dockerfile: docker/judge/java/Dockerfile, target: '' }
          - { image: judge-python, dockerfile: docker/judge/python/Dockerfile, target: '' }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/quocdung23/bkpractice-${{ matrix.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: bkpractice-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Configure pinned production SSH access
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          set -Eeuo pipefail
          for name in PROD_SSH_HOST PROD_SSH_KNOWN_HOSTS PROD_SSH_PORT PROD_SSH_PRIVATE_KEY PROD_SSH_USER; do
            [[ -n "${!name}" ]] || { echo "Missing production environment secret: $name" >&2; exit 1; }
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519"

      - name: Deploy published commit SHA
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
        run: |
          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -p "$PROD_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "sudo /usr/local/sbin/bkpractice-deploy '${{ github.sha }}'"
